# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file and provisions the web service below.
#
# Database is Supabase, not Render's own Postgres — DATABASE_URL is set by
# hand in the Render dashboard (Environment tab) to Supabase's *pooled*
# connection string (Project Settings -> Database -> Connection string ->
# "Transaction" mode, port 6543). Use the pooler, not the direct :5432
# connection — Supabase's direct-connection limit is low and shared across
# every client on the project, while the Supavisor pooler (Transaction mode)
# is built for exactly this "a web app holds a connection pool" case.
# server/db.ts's node-postgres driver doesn't use named prepared statements,
# so it's compatible with transaction-mode pooling without extra config.
#
# Anything with generateValue is filled in by Render itself. Everything else
# under envVars either has a sensible default here or must be set by hand in
# the service's Environment tab after the first deploy (marked below) — real
# secrets (connection strings, API keys) don't belong committed to this file.
services:
  - type: web
    name: destira
    runtime: node
    plan: starter # free tier spins the service down on idle, which drops all
      # in-memory sessions (this app doesn't use a session store yet — see
      # LOCAL_DEV.md) and admin login attempt counters on every wake; fine for
      # a demo, not for real users signing in and staying signed in.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Set by hand — Supabase's pooled ("Transaction" mode, port 6543)
      # connection string. See the header comment above.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOTP_ENC_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://destira.date
      # Set by hand in the Render dashboard once the service exists — email
      # is a no-op without these (server/email/resend.ts), never crashes:
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      # Optional — without it, AI Twin endpoints fall back to canned text
      # instead of real DeepSeek (Hive Models) responses (LOCAL_DEV.md):
      - key: DEEPSEEK_API_KEY
        sync: false
