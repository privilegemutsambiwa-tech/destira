<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBF8F5" id="meta-theme-color" />
    <title>Destira</title>
    <!-- Sets data-theme before first paint — no flash of the wrong theme.
         Light is the app's official default: an unset/invalid preference
         resolves straight to light, not the OS setting. Only an explicit
         "system" choice (made in Settings) still follows
         prefers-color-scheme. Plus the <meta name="theme-color"> above,
         which a media-attribute pair can't cover once the user has
         explicitly overridden the OS preference in-app. Synchronous,
         blocking, in <head>, on purpose: this has to run before the
         browser's first frame, not just before CSS loads. Kept in lockstep
         with client/src/hooks/use-theme.ts, the only other place that
         reads/writes destira-theme or this meta tag. -->
    <script>
      (function () {
        var THEME_COLOR = { dark: "#0C0910", light: "#FBF8F5" };
        // localStorage can throw (private mode / disabled) — read defensively
        // so a failure here still lands on the light default below, not on
        // index.css's bare-:root dark fallback.
        var v = null;
        try {
          v = localStorage.getItem("destira-theme");
        } catch (e) {
          /* unavailable — v stays null, treated as "no preference saved" */
        }
        var resolved;
        if (v === "light" || v === "dark") {
          document.documentElement.setAttribute("data-theme", v);
          resolved = v;
        } else if (v === "system") {
          // Explicit "system" sets no attribute — index.css's
          // :root:not([data-theme]) + prefers-color-scheme handles the CSS
          // side; this just needs the same answer for the meta tag below.
          resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } else {
          // No preference saved yet — light, the app default, not the OS setting.
          document.documentElement.setAttribute("data-theme", "light");
          resolved = "light";
        }
        try {
          var meta = document.getElementById("meta-theme-color");
          if (meta) meta.setAttribute("content", THEME_COLOR[resolved]);
        } catch (e) {
          /* ignore — meta tag already has the light default in markup */
        }
      })();
    </script>
    <!-- Icons: the two rings on a cream tile (scripts/generate-brand-assets.mjs).
         Google's results use a 48px multiple, so 48/96/192 are all offered. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/destira-favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/destira-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/destira-favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/destira-favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/destira-icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/destira-icon-180.png" />
    <!-- Link previews (WhatsApp, Facebook, X) for any page without its own.
         Event and group links replace these server-side (data-og-default). -->
    <meta name="description" content="Personality-first dating. Your AI twin meets theirs first and does the awkward part, so you only talk to people worth talking to." data-og-default />
    <meta property="og:site_name" content="Destira" data-og-default />
    <meta property="og:type" content="website" data-og-default />
    <meta property="og:title" content="Destira: come and find your person" data-og-default />
    <meta property="og:description" content="Your AI twin meets theirs first and does the awkward part. Free to join." data-og-default />
    <meta property="og:image" content="https://destira.date/brand/og-default.png" data-og-default />
    <meta property="og:image:width" content="1200" data-og-default />
    <meta property="og:image:height" content="630" data-og-default />
    <meta name="twitter:card" content="summary_large_image" data-og-default />
    <meta name="twitter:image" content="https://destira.date/brand/og-default.png" data-og-default />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Destira","url":"https://destira.date","logo":"https://destira.date/brand/destira-icon-512.png"}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The three fonts (Instrument Serif, DM Sans, DM Mono) are self-hosted:
         bundled from @fontsource in main.tsx, served from this origin. -->
    <!-- Pre-paint splash styles. Inline and self-contained on purpose — this
         has to render before index.css and the app's own scripts even reach
         the network, so it can't depend on any of the
         app's own stylesheet. Colors and the breathe curve are copied from
         index.css's --vf-ink/--vf-text/--vf-muted tokens and the vf-breathe
         keyframe, not re-derived — keep them in lockstep by hand. -->
    <style>
      #vf-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0C0910;
        padding-bottom: 8%; /* pulls the block slightly above true center */
      }
      #vf-splash-mark {
        animation: vf-splash-breathe 3.2s ease-in-out 800ms infinite;
        transform-origin: center;
      }
      /* The rings draw together into the lens in 600 ms (brief 5.8); same
         keyframes as DestiraMarkMotion in index.css. */
      #vf-splash-mark .m { animation: vf-splash-mint 600ms cubic-bezier(.2,.8,.2,1) both; }
      #vf-splash-mark .e { animation: vf-splash-ember 600ms cubic-bezier(.2,.8,.2,1) both; }
      #vf-splash-mark .l { animation: vf-splash-lens 260ms ease-out 420ms both; }
      @keyframes vf-splash-mint { from { transform: translateX(18px); } to { transform: none; } }
      @keyframes vf-splash-ember { from { transform: translateX(-18px); } to { transform: none; } }
      @keyframes vf-splash-lens { from { opacity: 0; } to { opacity: 1; } }
      #vf-splash-word {
        margin-top: 20px;
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 44px;
        line-height: 1;
        letter-spacing: -0.015em;
        color: #F5F0EA;
      }
      #vf-splash-tag {
        margin-top: 14px;
        font-family: "DM Mono", "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #A79FB4;
      }
      @keyframes vf-splash-breathe {
        0%, 100% { transform: scale(1); opacity: .78; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #vf-splash-mark, #vf-splash-mark * { animation: none !important; }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) #vf-splash { background: #FBF8F5; }
        html:not([data-theme]) #vf-splash-word { color: #1A1418; }
        html:not([data-theme]) #vf-splash-tag { color: #6B5F68; }
      }
      html[data-theme="light"] #vf-splash { background: #FBF8F5; }
      html[data-theme="light"] #vf-splash-word { color: #1A1418; }
      html[data-theme="light"] #vf-splash-tag { color: #6B5F68; }
    </style>
  </head>
  <body>
    <!-- Removed in App.tsx's first layout effect, the instant React can
         paint the real UI — see the comment there for why. If you're
         seeing this for more than a second or two, the app's JS bundle is
         too slow to arrive, not this element. -->
    <div id="vf-splash">
      <svg id="vf-splash-mark" width="128" height="102" viewBox="26 17 108 86" overflow="visible" role="img" aria-label="Destira">
        <defs><clipPath id="vfSplashLens"><circle cx="96" cy="60" r="34"/></clipPath></defs>
        <g transform="rotate(-15 80 60)">
          <circle class="m" cx="96" cy="60" r="34" fill="none" stroke="#8FE3C7" stroke-width="6"/>
          <circle class="e" cx="64" cy="60" r="34" fill="none" stroke="#FF6B4A" stroke-width="6"/>
          <g class="l" clip-path="url(#vfSplashLens)"><circle cx="64" cy="60" r="34" fill="#F5F0EA"/></g>
        </g>
      </svg>
      <div id="vf-splash-word">destira</div>
      <div id="vf-splash-tag">resonance over photographs</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
